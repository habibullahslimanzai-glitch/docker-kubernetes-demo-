
name: MLOps CI Pipeline

on:
  push:
    paths:
      - 'mlops/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'mlops/**'
      - '.github/workflows/ci.yml'
      
permissions:
  contents: read
  packages: write



jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r mlops/requirements.txt pytest

      - name: Run model tests
        run: pytest -s mlops/test_model.py
        
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./mlops
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/iris-ml-api:latest

      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1.12.0

      - name: Deploy ML API to Kubernetes
        run: |
          kubectl apply -f mlops/k8s/deployment.yaml
          kubectl apply -f mlops/k8s/service.yaml
          kubectl rollout status deployment/iris-ml-api --timeout=180s

      - name: Test deployed API
        run: |
          kubectl port-forward service/iris-ml-service 8080:80 > /tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/; then
              echo "Kubernetes API test passed!"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/port-forward.log
          kubectl get pods
          exit 1


